<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Vice Cover Studio</h1>
    <p>Your photos, a bold caption, a Vice sunset — a poster cover in three steps.</p>

    <fieldset id="layout">
      <legend>1 · Layout</legend>
      <div class="row">
        <button type="button" data-value="poster">Poster</button>
        <button type="button" data-value="trio">Trio</button>
        <button type="button" data-value="duo">Duo</button>
        <button type="button" data-value="quad">Quad</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>2 · Photos — one per panel</legend>
      <div class="row" id="panel-picker"></div>
      <label>Your photo <input id="photo" type="file" accept="image/*"></label>
      <div class="row">
        <button type="button" data-sample="pier">Sample: Pier</button>
        <button type="button" data-sample="boulevard">Sample: Boulevard</button>
        <button type="button" id="fill-all">Fill all panels</button>
      </div>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <label>Pan left–right <input id="panx" type="range" min="-0.3" max="0.3" step="0.01" value="0"></label>
      <label>Pan up–down <input id="pany" type="range" min="-0.3" max="0.3" step="0.01" value="0"></label>
    </fieldset>

    <fieldset>
      <legend>3 · Caption &amp; grade</legend>
      <label>Title <input id="title" type="text" maxlength="30" value="Neon Heist"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="Vice Coast"></label>
      <div class="row" id="grade">
        <button type="button" data-value="sunset">Sunset</button>
        <button type="button" data-value="neon">Neon</button>
        <button type="button" data-value="golden">Golden</button>
        <button type="button" data-value="noir">Noir</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Export</legend>
      <label>Post size
        <select id="size">
          <option value="1080x1080">Square 1080 x 1080</option>
          <option value="1080x1350" selected>Portrait 1080 x 1350</option>
          <option value="1920x1080">Wide 1920 x 1080</option>
        </select>
      </label>
      <button id="export" type="button" class="primary">Export PNG</button>
      <p id="status" role="status"></p>
    </fieldset>
    <p class="fine">100% original art — no Rockstar logo, artwork or font. Photos stay on your machine.</p>
  </section>
  <canvas id="cover" width="1080" height="1350" aria-label="The cover preview"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
